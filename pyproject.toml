[project]
name = "vcm-vvc-screening"
version = "0.1.0"
description = "Screening experiments for standard-compliant VVC coding for machine vision (RAMU-Lite, MAPS-ALF)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "scikit-learn>=1.3", "pyyaml>=6.0",
                "pycocotools>=2.0.7"]

[project.optional-dependencies]
torch = ["torch>=2.1", "torchvision>=0.16"]

[tool.pytest.ini_options]
pythonpath = ["tools"]
testpaths = ["tests"]
